apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pipeshub-ai.fullname" . }}
  labels:
    {{- include "pipeshub-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pipeshub-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pipeshub-ai.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: main
              containerPort: 8091
              protocol: TCP
            - name: connector
              containerPort: 8088
              protocol: TCP
            - name: frontend
              containerPort: 3000
              protocol: TCP
            - name: query
              containerPort: 8000
              protocol: TCP
            - name: indexing
              containerPort: 8081
              protocol: TCP
          env:
            # Core environment settings
            - name: NODE_ENV
              value: {{ .Values.config.nodeEnv | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.config.allowedOrigins | quote }}
            
            # Security settings
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pipeshub-ai.fullname" . }}-secrets
                  key: secret-key
            
            # Public endpoints
            - name: CONNECTOR_PUBLIC_BACKEND
              value: {{ .Values.config.connectorPublicBackend | quote }}
            - name: FRONTEND_PUBLIC_URL
              value: {{ .Values.config.frontendPublicUrl | quote }}
            
            # Internal service URLs
            - name: QUERY_BACKEND
              value: "http://localhost:8000"
            - name: CONNECTOR_BACKEND
              value: "http://localhost:8088"
            - name: INDEXING_BACKEND
              value: "http://localhost:8091"
            
            # ETCD / KV Store config
            - name: KV_STORE_TYPE
              value: {{ .Values.kvStoreType | quote }}
            {{- if .Values.managed.etcd }}
            - name: ETCD_URL
              value: {{ .Values.external.etcd.url | quote }}
            - name: ETCD_HOST
              value: {{ .Values.external.etcd.host | quote }}
            {{- else }}
            - name: ETCD_URL
              value: "http://{{ include "pipeshub-ai.fullname" . }}-etcd:2379"
            - name: ETCD_HOST
              value: "{{ include "pipeshub-ai.fullname" . }}-etcd"
            {{- end }}

            # ArangoDB config
            - name: DATA_STORE
              value: {{ .Values.dataStore | quote }}
            {{- if .Values.managed.arango }}
            - name: ARANGO_URL
              value: {{ .Values.external.arango.url | quote }}
            - name: ARANGO_DB_NAME
              value: {{ .Values.external.arango.dbName | quote }}
            - name: ARANGO_USERNAME
              value: {{ .Values.external.arango.username | quote }}
            {{- if .Values.external.arango.passwordSecretName }}
            - name: ARANGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.arango.passwordSecretName }}
                  key: {{ .Values.external.arango.passwordSecretKey }}
            {{- else }}
            - name: ARANGO_PASSWORD
              value: {{ .Values.external.arango.password | quote }}
            {{- end }}
            {{- else }}
            - name: ARANGO_URL
              value: "http://{{ include "pipeshub-ai.fullname" . }}-arango:8529"
            - name: ARANGO_DB_NAME
              value: "es"
            - name: ARANGO_USERNAME
              value: "root"
            - name: ARANGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pipeshub-ai.fullname" . }}-secrets
                  key: arango-password
            {{- end }}
            {{- if eq .Values.dataStore "neo4j" }}
            # Neo4j config (app uses Neo4j as graph DB when dataStore=neo4j)
            - name: GRAPH_DB_TYPE
              value: "neo4j"
            {{- if .Values.managed.neo4j }}
            - name: NEO4J_URI
              value: {{ .Values.external.neo4j.uri | quote }}
            - name: NEO4J_USERNAME
              value: {{ .Values.external.neo4j.username | quote }}
            {{- if .Values.external.neo4j.passwordSecretName }}
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.neo4j.passwordSecretName }}
                  key: {{ .Values.external.neo4j.passwordSecretKey }}
            {{- else }}
            - name: NEO4J_PASSWORD
              value: {{ .Values.external.neo4j.password | quote }}
            {{- end }}
            - name: NEO4J_DATABASE
              value: {{ .Values.external.neo4j.database | quote }}
            {{- else }}
            - name: NEO4J_URI
              value: "bolt://{{ include "pipeshub-ai.fullname" . }}-neo4j:7687"
            - name: NEO4J_USERNAME
              value: {{ .Values.neo4j.auth.username | quote }}
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pipeshub-ai.fullname" . }}-secrets
                  key: neo4j-password
            - name: NEO4J_DATABASE
              value: {{ .Values.neo4j.auth.database | quote }}
            {{- end }}
            {{- end }}
            
            # Kafka config
            {{- if .Values.managed.kafka }}
            - name: KAFKA_BROKERS
              value: {{ .Values.external.kafka.brokers | quote }}
            - name: KAFKA_SSL
              value: {{ .Values.external.kafka.ssl | quote }}
            {{- if .Values.external.kafka.saslMechanism }}
            - name: KAFKA_SASL_MECHANISM
              value: {{ .Values.external.kafka.saslMechanism | quote }}
            - name: KAFKA_USERNAME
              value: {{ .Values.external.kafka.username | quote }}
            {{- if .Values.external.kafka.passwordSecretName }}
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.kafka.passwordSecretName }}
                  key: {{ .Values.external.kafka.passwordSecretKey }}
            {{- end }}
            {{- end }}
            {{- else }}
            - name: KAFKA_BROKERS
              value: "{{ include "pipeshub-ai.fullname" . }}-kafka:9092"
            {{- end }}

            # Redis config
            {{- if .Values.managed.redis }}
            - name: REDIS_HOST
              value: {{ .Values.external.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.external.redis.port | quote }}
            {{- if .Values.external.redis.passwordSecretName }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.redis.passwordSecretName }}
                  key: {{ .Values.external.redis.passwordSecretKey }}
            {{- else }}
            - name: REDIS_PASSWORD
              value: {{ .Values.external.redis.password | quote }}
            {{- end }}
            {{- if .Values.external.redis.url }}
            - name: REDIS_URL
              value: {{ .Values.external.redis.url | quote }}
            {{- end }}
            {{- else }}
            - name: REDIS_HOST
              value: "{{ include "pipeshub-ai.fullname" . }}-redis-master"
            - name: REDIS_PORT
              value: "6379"
            {{- if .Values.redis.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pipeshub-ai.fullname" . }}-secrets
                  key: redis-password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ include "pipeshub-ai.fullname" . }}-redis-master:6379"
            {{- else }}
            - name: REDIS_PASSWORD
              value: ""
            - name: REDIS_URL
              value: "redis://{{ include "pipeshub-ai.fullname" . }}-redis-master:6379"
            {{- end }}
            {{- end }}

            # MongoDB config
            {{- if .Values.managed.mongodb }}
            - name: MONGO_URI
              value: {{ .Values.external.mongodb.uri | quote }}
            - name: MONGO_DB_NAME
              value: {{ .Values.external.mongodb.dbName | quote }}
            {{- else }}
            {{- if .Values.mongodb.auth.enabled }}
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "pipeshub-ai.fullname" . }}-secrets
                  key: mongodb-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pipeshub-ai.fullname" . }}-secrets
                  key: mongodb-password
            - name: MONGO_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@{{ include "pipeshub-ai.fullname" . }}-mongodb:27017/?authSource=admin"
            {{- else }}
            - name: MONGO_URI
              value: "mongodb://{{ include "pipeshub-ai.fullname" . }}-mongodb:27017"
            {{- end }}
            - name: MONGO_DB_NAME
              value: "es"
            - name: REPLICA_SET_AVAILABLE
              value: "false"
            {{- end }}

            # Qdrant config
            {{- if .Values.managed.qdrant }}
            {{- if .Values.external.qdrant.apiKeySecretName }}
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.qdrant.apiKeySecretName }}
                  key: {{ .Values.external.qdrant.apiKeySecretKey }}
            {{- else }}
            - name: QDRANT_API_KEY
              value: {{ .Values.external.qdrant.apiKey | quote }}
            {{- end }}
            - name: QDRANT_HOST
              value: {{ .Values.external.qdrant.host | quote }}
            - name: QDRANT_GRPC_PORT
              value: {{ .Values.external.qdrant.grpcPort | quote }}
            - name: QDRANT_PORT
              value: {{ .Values.external.qdrant.port | quote }}
            {{- else }}
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pipeshub-ai.fullname" . }}-secrets
                  key: qdrant-api-key
            - name: QDRANT_HOST
              value: "{{ include "pipeshub-ai.fullname" . }}-qdrant"
            - name: QDRANT_GRPC_PORT
              value: "6334"
            - name: QDRANT_PORT
              value: "6333"
            {{- end }}
            - name: HOME
              value: /home/user

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: pipeshub-storage
              mountPath: /data/pipeshub
              subPath: data
            - name: pipeshub-storage
              mountPath: /root/.local
              subPath: root-local
            - name: pipeshub-storage
              mountPath: /app/python/logs
              subPath: logs
            - name: pipeshub-storage
              mountPath: /home/user
              subPath: home
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: frontend
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: frontend
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: cache
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: pipeshub-storage
          persistentVolumeClaim:
            claimName: {{ include "pipeshub-ai.fullname" . }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
