name: Terraform Plan

on:
  pull_request:
    paths:
      - 'deployment/terraform/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write  # For OIDC

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.changes.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
      - id: changes
        # Detect which cloud/env combinations changed
        # Output as JSON array like ["aws/dev", "azure/dev"]
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD -- deployment/terraform/ | \
            grep -oP 'environments/\K[^/]+/[^/]+' | sort -u | jq -R -s 'split("\n") | map(select(. != ""))' -c)
          # If module changes, plan all environments
          if git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD -- deployment/terraform/modules/; then
            CHANGED='["aws/dev","aws/staging","aws/production","azure/dev","azure/staging","azure/production","gcp/dev","gcp/staging","gcp/production"]'
          fi
          echo "environments=${CHANGED:-'["aws/dev"]'}" >> $GITHUB_OUTPUT

  terraform-plan:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ fromJson(needs.detect-changes.outputs.environments) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Extract cloud and env
        id: extract
        run: |
          echo "cloud=$(echo ${{ matrix.environment }} | cut -d/ -f1)" >> $GITHUB_OUTPUT
          echo "env=$(echo ${{ matrix.environment }} | cut -d/ -f2)" >> $GITHUB_OUTPUT

      # AWS OIDC auth
      - name: Configure AWS Credentials
        if: steps.extract.outputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      # Azure OIDC auth
      - name: Azure Login
        if: steps.extract.outputs.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # GCP OIDC auth
      - name: GCP Auth
        if: steps.extract.outputs.cloud == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive deployment/terraform/

      - name: Terraform Init
        working-directory: deployment/terraform/environments/${{ matrix.environment }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: deployment/terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: deployment/terraform/environments/${{ matrix.environment }}
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "plan_output<<EOF" >> $GITHUB_OUTPUT
          head -c 60000 plan_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan: \`${{ matrix.environment }}\`

            #### Format: \`${{ steps.fmt.outcome }}\`
            #### Init: \`${{ steps.init.outcome }}\`
            #### Validate: \`${{ steps.validate.outcome }}\`
            #### Plan: \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${{ steps.plan.outputs.plan_output }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Security Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: deployment/terraform/
          soft_fail: true

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
